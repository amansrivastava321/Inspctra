# generic_linux.yaml — Generic Linux native application interactive testing
# Requires: Linux OS + pyatspi + scrot.
#
# Setup:
#   pip install pyatspi
#   sudo apt-get install scrot xdotool
#   gsettings set org.gnome.desktop.interface toolkit-accessibility true
#
# Usage (dry-run — run on Linux):
#   python -m qa_ai.cli interactive-test --config examples/interactive_runtime/generic_linux.yaml --dry-run

app_name: MyLinuxApp
app_type: native_linux
working_dir: .
launch_command: "mylinuxapp &"
readiness_timeout_seconds: 30

ui_automation:
  accessibility_timeout_seconds: 10

linux:
  use_atspi: true
  display: ":0"

permission_required: true
screenshot_enabled: true
log_capture_enabled: false
dangerous_actions_require_approval: true

max_actions: 30
max_duration_seconds: 300
output_dir: artifacts

test_objectives:
  - "Main window"
  - "Menu bar"
  - "Buttons"

permissions:
  launch_app: ask
  interact_with_ui: ask
  take_screenshots: ask
  call_external_apis: ask
  call_ai_providers: always_ask
  modify_database: always_ask
  destructive_actions: always_ask

# NOTE: Requires Linux OS. Returns CapabilityGap on macOS/Windows.
# AT-SPI must be enabled in desktop settings.
# xdotool required for keyboard input: sudo apt-get install xdotool
