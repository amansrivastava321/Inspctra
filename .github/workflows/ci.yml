name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python compilation
        run: python -m compileall qa_ai/

      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium

      - name: Collect tests
        timeout-minutes: 3
        env:
          PYTHONFAULTHANDLER: '1'
        run: |
          ulimit -c 0
          timeout --signal=ABRT --kill-after=10s 120s python -u -m pytest --collect-only tests/ -vv -s

      - name: Run smoke test
        run: python -m pytest tests/smoke/test_full_journey.py -v

      - name: Run backend tests
        run: python -m pytest tests/ -v --ignore=tests/smoke/test_external_real_execution.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=inspectra-ui

      - name: Run tests
        run: npm test --workspace=inspectra-ui -- --watchAll=false

      - name: Build
        run: npm run build --workspace=inspectra-ui

      - name: Set up Python for end-to-end tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies for end-to-end tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium for end-to-end tests
        run: |
          python -m playwright install --with-deps chromium
          npx playwright install --with-deps chromium
        working-directory: apps/inspectra_ui

      - name: Start backend for end-to-end tests
        run: |
          mkdir -p "$RUNNER_TEMP/inspectra-artifacts"
          INSPECTRA_ARTIFACTS_DIR="$RUNNER_TEMP/inspectra-artifacts" \
          INSPECTRA_ENABLE_DEV_CLEANUP=true \
          nohup python -m uvicorn qa_ai.server:app --host 127.0.0.1 --port 8765 > "$RUNNER_TEMP/backend.log" 2>&1 &
          curl --silent --show-error --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8765/api/health

      - name: Run end-to-end tests
        run: npm run test:e2e --workspace=inspectra-ui
        env:
          E2E_PYTHON: python
