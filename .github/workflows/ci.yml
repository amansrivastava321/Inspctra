name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python compilation
        run: python -m compileall qa_ai/

      - name: Collect tests
        run: python -m pytest --collect-only

      - name: Run smoke test
        run: python -m pytest tests/smoke/test_full_journey.py -v

      - name: Run backend tests
        run: python -m pytest tests/ -v --ignore=tests/smoke/test_external_real_execution.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=inspectra-ui

      - name: Run tests
        run: npm test --workspace=inspectra-ui -- --watchAll=false

      - name: Build
        run: npm run build --workspace=inspectra-ui

