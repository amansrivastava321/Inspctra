name: Native devices

# Runs the desktop and mobile engines against real platforms: an Android emulator, a Windows desktop, and a
# Mac with the iOS Simulator. Screenshots from each are uploaded as workflow artifacts.

on:
  pull_request:
    paths:
      - 'qa_ai/native_execution/**'
      - 'qa_ai/product_backend/run_manager.py'
      - 'qa_ai/product_backend/routers/native.py'
      - 'tests/native_e2e/**'
      - '.github/workflows/native-devices.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run against a real Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          INSPECTRA_NATIVE_E2E: android
          INSPECTRA_E2E_ARTIFACTS: native-e2e-artifacts
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python -m pytest tests/native_e2e/test_android_device.py -v -rs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: native-e2e-artifacts
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pywinauto pillow

      - name: Run against the real Windows desktop
        env:
          INSPECTRA_NATIVE_E2E: windows
          INSPECTRA_E2E_ARTIFACTS: native-e2e-artifacts
        run: python -m pytest tests/native_e2e/test_windows_desktop.py -v -rs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: native-e2e-artifacts
          if-no-files-found: ignore

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install idb (taps and typing in the iOS Simulator)
        continue-on-error: true
        run: |
          brew tap facebook/fb
          brew install idb-companion
          python -m pip install fb-idb
          idb --help > /dev/null && echo "INSPECTRA_IDB_READY=1" >> "$GITHUB_ENV"

      - name: Run against the real Mac and iOS Simulator
        env:
          INSPECTRA_NATIVE_E2E: macos
          INSPECTRA_E2E_ARTIFACTS: native-e2e-artifacts
        run: python -m pytest tests/native_e2e/test_macos_and_ios.py -v -rs -s

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-ios-screenshots
          path: native-e2e-artifacts
          if-no-files-found: ignore
